spring:
  application:
    name: agent-chat
  thymeleaf:
    cache: false

server:
  port: 8080

# ---------------------------------------------------------------------------
# Everything the agent does is tunable from here. The page may override any of
# the `defaults` per request; whatever it leaves empty falls back to these.
# ---------------------------------------------------------------------------
agent:
  api-key: ${GROQ_API_KEY:}                                   # never hardcode the key
  endpoint: https://api.groq.com/openai/v1/chat/completions
  connect-timeout: 10s
  read-timeout: 120s

  # Offered in the model dropdown on the page (must match what your key can access:
  # GET https://api.groq.com/openai/v1/models).
  available-models:
    - openai/gpt-oss-20b
    - openai/gpt-oss-120b
    - qwen/qwen3.8-27b
    - qwen/qwen3.6-27b
    - groq/compound-mini

  # Offered in the reasoning-effort dropdown. "" means omit the parameter entirely —
  # required for models that don't support it (qwen, compound, allam).
  reasoning-efforts:
    - ""
    - low
    - medium
    - high

  defaults:
    model: openai/gpt-oss-20b
    system-prompt: "You are a concise, helpful assistant. Answer directly and avoid filler."
    temperature: 1.0
    max-completion-tokens: 1024
    reasoning-effort: ""            # "" = omit (works on every model) | low | medium | high
                                    # only openai/gpt-oss-* accept low|medium|high
    stop-sequences: []              # e.g. ["\n\n", "END"]
    response-schema: ""             # optional JSON schema -> forces structured output

  input-policy:
    max-length: 8000                # 0 = unlimited

  output-policy:
    max-length: 0                   # 0 = unlimited

  memory:
    # Backstop, counted in messages (1 turn = 2 messages). With compression on, the stack never
    # gets this far: it is folded at keep-recent + compress-every and then shrinks back, so this
    # only bites if compression is switched off. Keep it above that sum or turns will be
    # destroyed before the summarizer ever reads them. 0 = keep everything.
    # The system prompt is not stored — it is re-applied fresh on every turn.
    max-messages: 20

    # json = the dialogue is written to disk and reloaded on startup, so a restart is
    # invisible to the user. memory = kept in RAM only, forgotten on shutdown.
    store: json
    file: ./data/conversations.json

  # The second window. max-messages above bounds the dialogue in messages; the model bills
  # and rejects in tokens, so the prompt is priced locally before every call.
  context:
    # Each call must fit prompt + max-completion-tokens into this. These are the models'
    # real limits, so overflow is unreachable by hand — see application-demo.yml for a
    # pretend window small enough to hit on camera.
    windows:
      "[openai/gpt-oss-20b]": 131072
      "[openai/gpt-oss-120b]": 131072
      "[qwen/qwen3.8-27b]": 131072
      "[qwen/qwen3.6-27b]": 131072
      "[groq/compound-mini]": 131072
    default-window: 131072

    # off  = send anyway and let Groq reject it (shows the raw context_length_exceeded)
    # fail = refuse locally, before the call is paid for, and explain the arithmetic
    # trim = drop the oldest turns until it fits, the way production assistants do
    overflow-policy: fail

    # Fraction of the window at which the page starts warning.
    warn-at: 0.80

  # The third answer to a growing prompt. max-messages and overflow-policy both shrink the
  # context by forgetting; this one rewrites the old turns into notes and sends those instead,
  # so the cost stops growing without the dialogue losing what happened.
  compression:
    # Default for new turns — the page can flip it per turn, which is how you compare the same
    # conversation with and without it.
    enabled: true

    # The tail that is always sent verbatim. Recency is where pronouns, corrections and
    # "no, the other one" live, and a summary is a poor substitute for the last few turns.
    keep-recent-messages: 6

    # Minimum backlog beyond that tail before summarizing is worth the request it costs.
    # 10 messages = 5 turns, so compression fires roughly every fifth turn.
    #
    # This number is an economic choice, not a cosmetic one. A fold costs a whole extra call —
    # measured at ~500 tokens, most of it the fixed instruction prompt — and buys back ~125
    # tokens on every turn that follows. Folding 10 messages at a time, that paid for itself
    # five turns later; folding 4 at a time it did not pay for itself at all within a short
    # conversation, because the same fixed cost was amortized over a quarter as much transcript.
    # Lower it to see compression sooner on camera, not to save more.
    compress-every: 10

    # Who writes the notes. Blank = whatever agent.defaults.model is. A small model is usually
    # the right call: summarizing is much easier than answering, and this runs on every 5th turn.
    model: openai/gpt-oss-20b

    # Ceiling on the notes, and therefore on this segment of every future prompt. This is the
    # number that makes the cost curve flat instead of quadratic.
    #
    # On a reasoning model this budget is NOT all notes: gpt-oss's hidden reasoning tokens are
    # billed against the same max_completion_tokens, and they are spent first. At 200 the model
    # burned the lot thinking and emitted "- Nur," — a summary truncated mid-name, which is worse
    # than none, because the messages behind it would have been folded away. The compressor now
    # refuses a finish_reason=length summary, so the failure is a skipped compaction and a WARN
    # rather than silent data loss — but the budget still has to cover both halves.
    max-summary-tokens: 800

    # "" omits the parameter (required for qwen/compound, which reject it). On gpt-oss, `low`
    # is what keeps most of the ceiling above available for the notes themselves: taking
    # minutes is not a reasoning-heavy task, and the output is bullet points, not an argument.
    reasoning-effort: low

logging:
  level:
    com.crispyland: INFO
