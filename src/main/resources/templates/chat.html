<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Agent Chat</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --card: #ffffff;
            --line: #e2e5ea;
            --ink: #1c1f24;
            --muted: #6b7280;
            --accent: #3b5bdb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 32px 20px 64px;
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .wrap { max-width: 880px; margin: 0 auto; }
        h1 { font-size: 22px; margin: 0 0 4px; }
        .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 18px;
        }
        label { display: block; font-size: 12px; font-weight: 600; color: var(--muted);
                text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
        textarea, input, select {
            width: 100%; padding: 9px 11px; font: inherit; color: var(--ink);
            background: #fff; border: 1px solid var(--line); border-radius: 7px;
        }
        textarea { resize: vertical; }
        input[type=range] { padding: 0; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .field { margin-bottom: 16px; }
        .field:last-child { margin-bottom: 0; }
        button {
            background: var(--accent); color: #fff; border: 0; border-radius: 7px;
            padding: 11px 22px; font: inherit; font-weight: 600; cursor: pointer;
        }
        button:hover { background: #364fc7; }
        details summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
        details[open] summary { margin-bottom: 16px; }
        .answer { white-space: pre-wrap; }
        .error { border-left: 3px solid #e03131; background: #fff5f5; color: #a12a2a; }
        .usage { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
        .pill {
            border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
            font-size: 12px; color: var(--muted); background: #fbfbfc;
        }
        .pill b { color: var(--ink); font-variant-numeric: tabular-nums; }
        .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
        h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
             color: var(--muted); margin: 0 0 10px; }
        .turn { padding: 12px 14px; border-radius: 9px; margin-bottom: 10px; white-space: pre-wrap; }
        .turn.user { background: #eef1fb; border: 1px solid #d8e0f7; }
        .turn.assistant { background: #f7f8fa; border: 1px solid var(--line); }
        .who { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase;
               letter-spacing: .05em; color: var(--muted); margin-bottom: 5px; }
        .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .ghost { background: transparent; color: var(--muted); border: 1px solid var(--line);
                 padding: 6px 12px; font-size: 12px; font-weight: 600; }
        .ghost:hover { background: #f1f3f5; color: var(--ink); }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Agent Chat</h1>
    <div class="sub">Spring Boot &rarr; <code>com.crispyland.agent</code> &rarr; Groq chat completions</div>

    <div class="card" th:if="${!#lists.isEmpty(transcript)}">
        <div class="bar">
            <h2 style="margin:0">Conversation
                <span th:text="'· ' + ${#lists.size(transcript)} + ' messages'"></span></h2>
            <form method="post" action="/reset" style="margin:0">
                <button type="submit" class="ghost">New chat</button>
            </form>
        </div>
        <div th:each="m : ${transcript}" class="turn"
             th:classappend="${m.user} ? 'user' : 'assistant'">
            <span class="who" th:text="${m.user} ? 'you' : 'agent'"></span>
            <span th:text="${m.content}"></span>
        </div>
    </div>

    <form method="post" action="/">
        <div class="card">
            <div class="field">
                <label for="userInput">Your message</label>
                <textarea id="userInput" name="userInput" rows="4" autofocus
                          placeholder="Ask anything — the agent remembers the turns above…"
                          th:text="${form.userInput}"></textarea>
            </div>
            <button type="submit">Send</button>
        </div>

        <div class="card">
            <details open>
                <summary>Request parameters</summary>

                <div class="grid">
                    <div class="field">
                        <label for="model">Model</label>
                        <select id="model" name="model">
                            <option th:each="m : ${models}" th:value="${m}" th:text="${m}"
                                    th:selected="${m == form.model}"></option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="temperature">Temperature — <span id="tempOut"
                              th:text="${form.temperature}">1.0</span></label>
                        <input type="range" id="temperature" name="temperature"
                               min="0" max="2" step="0.05" th:value="${form.temperature}"
                               oninput="document.getElementById('tempOut').textContent = this.value"/>
                    </div>
                    <div class="field">
                        <label for="maxCompletionTokens">Max completion tokens</label>
                        <input type="number" id="maxCompletionTokens" name="maxCompletionTokens"
                               min="1" max="32768" th:value="${form.maxCompletionTokens}"/>
                    </div>
                    <div class="field">
                        <label for="reasoningEffort">Reasoning effort</label>
                        <select id="reasoningEffort" name="reasoningEffort">
                            <option th:each="e : ${reasoningEfforts}" th:value="${e}"
                                    th:text="${e.isEmpty()} ? '(omit — for non-gpt-oss models)' : ${e}"
                                    th:selected="${e == form.reasoningEffort}"></option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label for="systemPrompt">System prompt</label>
                    <textarea id="systemPrompt" name="systemPrompt" rows="2"
                              th:text="${form.systemPrompt}"></textarea>
                </div>

                <div class="grid">
                    <div class="field">
                        <label for="stopSequences">Stop sequences (comma separated)</label>
                        <input type="text" id="stopSequences" name="stopSequences"
                               th:value="${form.stopSequences}" placeholder="optional"/>
                    </div>
                    <div class="field">
                        <label for="responseSchema">Response JSON schema</label>
                        <input type="text" id="responseSchema" name="responseSchema"
                               th:value="${form.responseSchema}" placeholder="optional"/>
                    </div>
                </div>
            </details>
        </div>
    </form>

    <div class="card error" th:if="${error}">
        <h2>Something went wrong</h2>
        <div th:text="${error}"></div>
    </div>

    <div class="card" th:if="${result}">
        <h2>Last turn</h2>

        <div class="usage">
            <span class="pill">prompt <b th:text="${result.usage.promptTokens}">0</b></span>
            <span class="pill">completion <b th:text="${result.usage.completionTokens}">0</b></span>
            <span class="pill">total <b th:text="${result.usage.totalTokens}">0</b></span>
            <span class="pill">session total <b th:text="${result.cumulativeUsage.totalTokens}">0</b></span>
            <span class="pill">latency <b th:text="${result.latencyMillis} + ' ms'">0 ms</b></span>
        </div>
        <div class="meta">
            <span th:text="${result.effectiveConfig.model}"></span>
            · finish: <span th:text="${result.finishReason}"></span>
            <span th:if="${result.verdict.scored}">
                · judge: <span th:text="${result.verdict.score}"></span>
            </span>
        </div>
    </div>
</div>
</body>
</html>
